name: Deploy

# On every push to main, the platform's shared workflow scans the image, pushes
# it to the platform's ECR registry as idp-apps/idp-sample-service, signs it,
# and commits the new tag
# to deploy/web.yaml, which Argo CD deploys. The commit it makes touches only
# deploy/, so it doesn't start another run.

on:
  push:
    branches: [main]
    paths-ignore: [deploy/**]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: write
      id-token: write
    uses: kushan94/eks-internal-developer-platform/.github/workflows/app-deploy.yml@main
    # The key can only push to this repo's own registry.
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
